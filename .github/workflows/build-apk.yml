
name: Build Arun's Music APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: unzip -q ArunsMusic-Fullscreen-Player-Android-Source.zip

      - name: Install dependencies and sync
        working-directory: ArunsMusicCustomBuild/DesiMusic-Android
        run: |
          npm install
          npx cap sync android

      - name: Build APK
        working-directory: ArunsMusicCustomBuild/DesiMusic-Android/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aruns-music-debug-apk
          path: ArunsMusicCustomBuild/DesiMusic-Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
