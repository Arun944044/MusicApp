
name: Build Arun's Music APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate and configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android source ZIP
        run: |
          unzip -q ArunsMusic-Fullscreen-Player-Android-Source.zip
          test -f ArunsMusicCustomBuild/DesiMusic-Android/package.json
          echo "Android source extracted successfully"

      - name: Install Node dependencies
        working-directory: ArunsMusicCustomBuild/DesiMusic-Android
        run: |
          npm install
          npx cap sync android

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ArunsMusicCustomBuild/DesiMusic-Android/android
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f ArunsMusicCustomBuild/DesiMusic-Android/android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK generated successfully"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aruns-Music-APK
          path: ArunsMusicCustomBuild/DesiMusic-Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
