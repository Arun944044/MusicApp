name: Build Arun's Music APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract app ZIP
        run: unzip -q ArunsMusic-Fullscreen-Player-Android-Source.zip

      - name: Install dependencies
        working-directory: ArunsMusicCustomBuild/DesiMusic-Android
        run: |
          npm install
          npx cap sync android

      - name: Build APK
        working-directory: ArunsMusicCustomBuild/DesiMusic-Android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aruns-Music-APK
          path: ArunsMusicCustomBuild/DesiMusic-Android/android/app/build/outputs/apk/debug/app-debug.apk
